apiVersion: networking.openshift.io/v1alpha1
kind: CUDNBgpConfig
metadata:
  name: cluster
spec:
  bgp:
    localASN: 65001
    livenessDetection: bfd

  routerNodeSelector:
    bgp_router: "true"

  aws:
    region: us-east-1
    routeServerIDs:               # terraform output vpc1-rs1-id
      - rs-0abc1234

# This rule is not used by the project rosa-bgp-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the networking.openshift.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: rosa-bgp-operator
    app.kubernetes.io/managed-by: kustomize
  name: cudnbgprouting-editor-role
rules:
- apiGroups:
  - networking.openshift.io
  resources:
  - cudnbgproutings
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - networking.openshift.io
  resources:
  - cudnbgproutings/status
  verbs:
  - get
